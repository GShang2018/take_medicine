plugins {
    id 'com.android.application'
}

// 签名信息只保存在本机 android/keystore.properties，不提交到 Git。
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.medremind.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.medremind.app"
        minSdk 26
        targetSdk 34
        versionCode 25
        versionName "1.5.11"
        resourceConfigurations += ["zh", "en"]
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'ScheduleExactAlarm', 'BatteryLife'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.work:work-runtime:2.9.0'
}

// 发版产物统一放到项目根目录的 dist/，根目录不再放 APK。
// assembleRelease 成功后自动复制并重命名为 吃药提醒-<versionName>.apk。
tasks.register('distApk', Copy) {
    from layout.buildDirectory.file('outputs/apk/release/app-release.apk')
    into rootProject.file('../dist')
    rename { "吃药提醒-${android.defaultConfig.versionName}.apk" }
    doFirst {
        println "复制 APK → dist/吃药提醒-${android.defaultConfig.versionName}.apk"
    }
}

tasks.matching { it.name == 'assembleRelease' }.configureEach {
    finalizedBy 'distApk'
}